<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Envio de mensagem</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <section class="card">
        <div class="header">
          <p class="eyebrow">Sistema de candidatura</p>
          <h1>Enviar mensagem para vaga</h1>
        </div>

        <form id="mail-form">
          <div class="grid two-columns">
            <label>
              <span>Nome do Recrutador (opcional)</span>
              <input id="recruiterName" name="recruiterName" type="text" placeholder="Ex.: Ana Silva" />
            </label>

            <label>
              <span>E-mail do Destinatário</span>
              <input id="recipientEmail" name="recipientEmail" type="email" placeholder="seu-email@empresa.com" required/>
            </label>
          </div>

          <div class="grid two-columns">
            <label>
              <span>Cc cópia oculta (opcional)</span>
              <input id="bcc" name="bcc" type="text" placeholder="email1@dominio.com, email2@dominio.com" />
            </label>

            <label>
              <span>Título do e-mail</span>
              <input id="subject" name="subject" type="text" maxlength="200" required />
            </label>
          </div>

          <div class="curriculum-field">
            <div class="curriculum-header">
              <label><span>Currículo</span></label>
              <button type="button" class="preview-btn" id="preview-curriculum" title="Visualizar currículo em nova aba">
                👁️ Visualizar PDF
              </button>
            </div>
            <div class="curriculum-box">
              <div class="curriculum-info">
                <span class="file-icon">📄</span>
                <div class="file-details">
                  <span class="file-name" id="selected-file-name">JoaoVitor.pdf</span>
                  <span class="file-badge" id="file-badge">Padrão</span>
                </div>
              </div>
              <div class="curriculum-actions-btns">
                <label for="curriculumFile" class="change-file-btn">
                  📁 Alterar arquivo
                </label>
                <input id="curriculumFile" name="curriculumFile" type="file" accept="application/pdf" class="visually-hidden" />
              </div>
            </div>
          </div>

          <label>
            <span>Corpo do e-mail</span>
            <textarea id="message" name="message" rows="14" required></textarea>
          </label>

          <p class="tags-help">
            Tags disponíveis: [saudacao], [primeiroNome], [nomeCompleto]
          </p>

          <div class="actions">
            <button type="button" class="secondary" id="reset-defaults">Restaurar padrão</button>
            <button type="submit" class="primary" id="submit-button">Enviar para ListaAuto</button>
          </div>
        </form>

        <div id="status" class="status" aria-live="polite"></div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
